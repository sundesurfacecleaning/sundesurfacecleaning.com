<!-- Free Quote Calculator -->
<section class="container section-light-bg" id="calculator" aria-labelledby="calc-title" style="padding-top: 2rem; padding-bottom: 2rem; border-radius: 16px;">
    <h2 id="calc-title" class="text-center">
        <svg class="icon" style="margin-right: 0.5rem; transform: scale(1.3);" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="16" y2="18"/></svg> 
        Instant Price Estimator
    </h2>

    <div class="calculator-card">
        <p class="text-center"><small>Selected Material: <strong id="calc-selected-material" style="color: var(--brand-azure);">CONCRETE</strong></small></p>
        <form onsubmit="return false;">
            <div class="range-container">
                <label for="sqft-range" class="sr-only">Adjust square footage</label>
                <input type="range" id="sqft-range" min="0" max="5000" step="50" value="210">
                <div style="display: flex; justify-content: space-between; font-size: 0.7rem; color: #999;">
                    <span>0 sqft</span>
                    <span>2,500 sqft</span>
                    <span>5,000+ sqft</span>
                </div>
            </div>

            <label for="sqft-input">Or type exact square footage:</label>
            <div class="input-group">
                <input type="number" id="sqft-input" placeholder="e.g. 200" min="0" value="210">
            </div>
        </form>

        <div class="calculator-grid" aria-live="polite">
            <div>
                <small id="label-gold">GOLD PACKAGE</small>
                <div id="calc-gold" class="calculator-price primary" aria-labelledby="label-gold">$135.00</div>
                <span class="min-badge" id="gold-min-badge">MINIMUM APPLIED</span>
            </div>
            <div class="calculator-divider">
                <small id="label-diamond">DIAMOND PACKAGE</small>
                <div id="calc-diamond" class="calculator-price navy" aria-labelledby="label-diamond">$135.00</div>
                <span class="min-badge" id="diamond-min-badge">MINIMUM APPLIED</span>
            </div>
        </div>
        <p class="calculator-footer-note" style="margin-top: 1rem;">* Estimates include minimum charges where applicable.</p>
        <div class="text-center mt-1">
            <a href="https://cal.com/sundesurfacecleaning/free-quote" id="calc-cta" target="_blank" class="cta button full-width">Book in person quote</a>
        </div>
    </div>
</section>
