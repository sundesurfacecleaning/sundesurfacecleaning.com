<!-- Structured Data (JSON-LD) -->

<!-- Global LocalBusiness Profile -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "{{ site.data.business.name }}",
  "image": "{{ site.data.business.logo }}",
  "url": "{{ site.data.business.url }}",
  "hasMap": "https://maps.google.com/?cid={{ site.data.business.cid }}",
  "telephone": "{{ site.data.business.telephone }}",
  "email": "{{ site.data.business.email }}",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Serving Seattle & Surrounding Areas",
    "addressLocality": "Seattle",
    "addressRegion": "WA",
    "addressCountry": "US"
  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": {{ site.data.business.latitude }},
    "longitude": {{ site.data.business.longitude }}
  },
  "priceRange": "{{ site.data.business.priceRange }}",
  "openingHoursSpecification": {
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
    "opens": "08:00",
    "closes": "20:00"
  },
  "aggregateRating": {
    "@type": "AggregateRating",
    "ratingValue": "{{ site.data.business.ratingValue }}",
    "reviewCount": "{{ site.data.business.reviewCount }}"
  },
  "areaServed": [
    "Seattle", "Bellevue", "Queen Anne", "Ballard", "Capitol Hill", "Magnolia", 
    "West Seattle", "Shoreline", "Edmonds", "Kirkland", "Redmond", 
    "Mercer Island", "Renton", "Issaquah", "Sammamish"
  ],
  "hasOfferCatalog": {
    "@type": "OfferCatalog",
    "name": "Pressure Washing & Surface Restoration Services",
    "itemListElement": [
      {
        "@type": "OfferCatalog",
        "name": "Concrete Cleaning",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": { "@type": "Service", "name": "Concrete Gold Restoration" },
            "price": "0.35",
            "priceCurrency": "USD",
            "description": "Eco-friendly pre-treatment and pressure wash for concrete."
          },
          {
            "@type": "Offer",
            "itemOffered": { "@type": "Service", "name": "Concrete Diamond Restoration & Long-Term Protection" },
            "price": "0.45",
            "priceCurrency": "USD",
            "description": "Complete concrete restoration with post-treatment inhibitors."
          }
        ]
      },
      {
        "@type": "OfferCatalog",
        "name": "Wood Cleaning",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": { "@type": "Service", "name": "Wood Gold Restoration" },
            "price": "0.45",
            "priceCurrency": "USD",
            "description": "Gentle wood cleaning with specialized solutions."
          },
          {
            "@type": "Offer",
            "itemOffered": { "@type": "Service", "name": "Wood Diamond Restoration & Long-Term Protection" },
            "price": "0.75",
            "priceCurrency": "USD",
            "description": "Premium wood restoration and preservation."
          }
        ]
      },
      {
        "@type": "OfferCatalog",
        "name": "Synthetic Wood Cleaning",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": { "@type": "Service", "name": "Synthetic Gold Restoration" },
            "price": "0.50",
            "priceCurrency": "USD",
            "description": "Safe cleaning for composite and synthetic decking."
          },
          {
            "@type": "Offer",
            "itemOffered": { "@type": "Service", "name": "Synthetic Diamond Restoration & Long-Term Protection" },
            "price": "0.85",
            "priceCurrency": "USD",
            "description": "Advanced protection for synthetic wood surfaces."
          }
        ]
      }
    ]
  }
}
</script>

<!-- Localized Service Schema (Renders only on Service Area Pages) -->
{% if page.layout == "service-area" %}
{% assign area = site.data.service_areas[page.area_key] %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Service",
  "name": "Pressure Washing & Surface Restoration in {{ area.name }}",
  "provider": {
    "@type": "LocalBusiness",
    "name": "{{ site.data.business.name }}",
    "image": "{{ site.data.business.logo }}",
    "telephone": "{{ site.data.business.telephone }}",
    "priceRange": "{{ site.data.business.priceRange }}"
  },
  "areaServed": {
    "@type": "AdministrativeArea",
    "name": "{{ area.name }}"
  },
  "description": "{{ area.description }}"
}
</script>
{% endif %}

<!-- FAQ Schema (Renders only on Homepage) -->
{% if page.url == "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Why should I choose Pre-Cleaning over just Water Pressure?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Water pressure alone only removes surface dirt. Both our Gold and Diamond packages use specialized pre-cleaning solutions that kill moss and algae at the root, preventing growth from returning quickly."
      }
    },
    {
      "@type": "Question",
      "name": "What is included in the Post-Cleaning treatment?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Included in our Diamond Restoration & Long-Term Protection, the post-treatment is a brightening agent that eliminates uneven wash lines and leaves a residual barrier to keep surfaces clean for up to 2 years."
      }
    },
    {
      "@type": "Question",
      "name": "Is the high pressure safe for my property?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because our Gold and Diamond packages use specialized solutions to do the heavy lifting, we can use a 'Soft Wash' technique. This lower pressure is much safer for your home."
      }
    }
  ]
}
</script>
{% endif %}
